version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ictu_ai_judge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ictu_ai_judge}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ictu_ai_judge_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ictu_ai_judge_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build: 
      context: ./backend
    container_name: ictu_ai_judge_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "python -m app.adapters.storage.minio_init && alembic upgrade head && uvicorn app.entrypoints.api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: 
      context: ./backend
    container_name: ictu_ai_judge_worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # [CRITICAL] DooD (Docker-out-of-Docker) for Sandbox execution
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      sandbox_builder:
        condition: service_completed_successfully
    command: celery -A app.adapters.worker.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: ictu_ai_judge_frontend
    restart: always
    ports:
      - "3456:80"
    depends_on:
      - backend

  sandbox_builder:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    image: ictu-ai-judge-sandbox:latest
    command: ["echo", "Sandbox image built successfully!"]
    restart: "no"

volumes:
  pgdata:
  minio_data:
