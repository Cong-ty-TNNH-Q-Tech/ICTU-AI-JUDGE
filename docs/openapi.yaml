openapi: 3.0.3
info:
  title: ICTU AI Judge API
  description: RESTful API spec for ICTU AI Judge Platform (FastAPI Backend)
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server

# Bảo mật: Yêu cầu JWT Token truyền ngầm qua HttpOnly Cookie thay vì Header Bearer.
security:
  - cookieAuth: []

paths:
  # ==========================================
  # AUTH & USER ENDPOINTS
  # ==========================================
  /auth/google-login:
    post:
      summary: Đăng nhập bằng Google OAuth
      tags:
        - Auth
      description: Gửi Google Access Token để đổi lấy JWT HttpOnly Cookie. Trả về thông tin User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                google_token:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công (Cookie được set ngầm).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token không hợp lệ hoặc email không thuộc @ictu.edu.vn

  /auth/login:
    post:
      summary: Đăng nhập bằng Email & Mật khẩu
      tags:
        - Auth
      description: Gửi Email và Mật khẩu để đổi lấy JWT HttpOnly Cookie. Trả về thông tin User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công (Cookie được set ngầm).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Thông tin đăng nhập không hợp lệ

  /auth/forgot-password:
    post:
      summary: Quên mật khẩu
      tags:
        - Auth
      description: Gửi yêu cầu cấp lại mật khẩu. Hệ thống sẽ gửi email chứa link reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Yêu cầu được chấp nhận. Hệ thống luôn trả về 200 để tránh rò rỉ email.
        '429':
          description: Quá nhiều yêu cầu, vui lòng thử lại sau.

  /auth/reset-password:
    post:
      summary: Đặt lại mật khẩu
      tags:
        - Auth
      description: Nhập token và mật khẩu mới để đặt lại mật khẩu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Đổi mật khẩu thành công.
        '400':
          description: Token không hợp lệ hoặc đã hết hạn.

  /auth/logout:
    post:
      summary: Đăng xuất
      tags:
        - Auth
      description: Xóa JWT HttpOnly Cookie.
      responses:
        '200':
          description: Đăng xuất thành công.

  /users/me:
    get:
      summary: Lấy thông tin cá nhân
      tags:
        - Users
      responses:
        '200':
          description: Thông tin user hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Chưa đăng nhập.

  /users/me/password:
    patch:
      summary: Đổi mật khẩu
      tags:
        - Users
      description: Đổi mật khẩu của người dùng hiện tại. Yêu cầu mật khẩu cũ (nếu có).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Đổi mật khẩu thành công.
        '400':
          description: Mật khẩu cũ không chính xác.
        '401':
          description: Chưa đăng nhập.

  /users/me/teams:
    get:
      summary: Lấy danh sách Đội thi (và Bài thi) mà tôi đang tham gia
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Phân trang danh sách Teams.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Team'

  # ==========================================
  # CHALLENGE ENDPOINTS
  # ==========================================
  /challenges:
    get:
      summary: Lấy danh sách Bài thi
      tags:
        - Challenges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách bài thi (Phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Challenge'
                  
    post:
      summary: Tạo Bài thi mới (Admin)
      tags:
        - Challenges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreate'
      responses:
        '201':
          description: Tạo cấu trúc thông tin JSON thành công.

  /challenges/{id}/upload-secrets:
    post:
      summary: Upload File Đáp án và Script chấm điểm (Dành cho Admin)
      tags:
        - Challenges
      description: Upload File Ground Truth và Custom Metric để lưu an toàn trên Storage ngầm, thí sinh không thể truy cập.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ground_truth_csv:
                  type: string
                  format: binary
                  description: File đáp án bắt buộc chứa cột 'Usage'
                metric_script_py:
                  type: string
                  format: binary
                  description: (Tùy chọn) Script python chấm điểm thủ công
                public_test_split_ratio:
                  type: integer
                  description: Tỉ lệ % tập Public (0-100)
                  default: 30
      responses:
        '200':
          description: Upload thành công.

  /challenges/{id}:
    get:
      summary: Chi tiết Bài thi
      tags:
        - Challenges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin chi tiết.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
    patch:
      summary: Cập nhật Bài thi (Admin)
      tags:
        - Challenges
      description: Cập nhật thông tin bài thi (mô tả, thời gian, luật thi). Bị khóa nếu bài đã có Submission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeUpdate'
      responses:
        '200':
          description: Cập nhật thành công.
        '403':
          description: Không có quyền (không phải Admin hoặc bài thi đã lock).
    delete:
      summary: Xóa mềm Bài thi (Admin - Soft Delete)
      tags:
        - Challenges
      description: Đặt `deleted_at` = now(), không xóa cứng khỏi Database.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Xóa mềm thành công.
        '403':
          description: Không có quyền hoặc bài thi đang diễn ra.

  /challenges/{id}/enroll:
    post:
      summary: Ghi danh (Tự động tạo Team of 1)
      tags:
        - Challenges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Ghi danh thành công, trả về Team ID.

  /challenges/{id}/participants:
    get:
      summary: Xem danh sách Whitelist (Admin)
      tags:
        - Challenges
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách sinh viên được cấp quyền tham gia Competition.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Participant'
    post:
      summary: Thêm Whitelist Participant (Admin)
      tags:
        - Challenges
        - Admin
      description: Thêm một hoặc nhiều user vào danh sách được phép tham gia Competition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách User ID cần thêm vào whitelist
      responses:
        '201':
          description: Thêm whitelist thành công.
        '403':
          description: Không có quyền Admin.

  /challenges/{id}/participants/by-identifiers:
    post:
      summary: Thêm Whitelist Participant bằng định danh (Admin)
      tags:
        - Challenges
        - Admin
      description: Thêm một hoặc nhiều user vào danh sách được phép tham gia Competition bằng Email, MSSV, hoặc UUID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers:
                  type: array
                  items:
                    type: string
                  description: Danh sách định danh (Email, MSSV, UUID)
      responses:
        '200':
          description: Thêm whitelist thành công, trả về số lượng thành công và các lỗi.
        '403':
          description: Không có quyền Admin.
        '422':
          description: Validation Error (Ví dụ trường identifiers trống).

  # ==========================================
  # TEAM ENDPOINTS
  # ==========================================
  /teams/{id}:
    patch:
      summary: Cập nhật tên Đội (Trưởng nhóm)
      tags:
        - Teams
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Tên đội mới"
      responses:
        '200':
          description: Đổi tên thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          description: Bạn không phải trưởng nhóm.
        '400':
          description: Đã qua thời hạn chốt đội hoặc lỗi logic.
        '404':
          description: Không tìm thấy đội.

  /teams/{id}/invites:
    post:
      summary: Trưởng nhóm tạo mã mời
      tags:
        - Teams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitee_email:
                  type: string
      responses:
        '201':
          description: Trả về Invite Token link.
        '403':
          description: Đội đã full hoặc bạn không phải trưởng nhóm.

  /teams/join:
    post:
      summary: Tham gia Đội qua mã mời
      tags:
        - Teams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Gia nhập thành công.
        '400':
          description: Bạn đã thuộc đội khác hoặc mã hết hạn.

  /teams/{id}/members/{user_id}:
    delete:
      summary: Xóa thành viên khỏi đội
      tags:
        - Teams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Xóa thành viên thành công.
        '403':
          description: Bạn không phải là đội trưởng.
        '404':
          description: Không tìm thấy thành viên trong đội.

  # ==========================================
  # SUBMISSION ENDPOINTS
  # ==========================================
  /challenges/{id}/submissions:
    get:
      summary: Lịch sử nộp bài của Đội
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách lượt nộp (Phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'

    post:
      summary: Upload file Nộp bài
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File CSV dự đoán
      responses:
        '201':
          description: File hợp lệ, bắt đầu chấm điểm ngầm (Trạng thái PENDING).
        '429':
          description: Vi phạm Rate Limit (Xin chờ X phút).
        '409':
          description: Trùng Hash MD5 (Spam, file này vừa nộp rồi).

  /submissions/{id}:
    patch:
      summary: Tích chọn bài tính điểm chung cuộc (Partial Update)
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_selected_for_private:
                  type: boolean
      responses:
        '200':
          description: Cập nhật cờ chọn bài thành công.

  /submissions/{id}/source-code:
    post:
      summary: Upload Source Code cuối kỳ (Top N Teams)
      tags:
        - Submissions
      description: Dành cho Top N đội. Bắt buộc nộp File Zip hoặc Ipynb kèm requirements.txt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Nộp Source code thành công.
        '403':
          description: Cuộc thi chưa kết thúc hoặc đội không lọt Top N.

  # ==========================================
  # LEADERBOARD ENDPOINTS
  # ==========================================
  /challenges/{id}/leaderboard:
    get:
      summary: Lấy bảng xếp hạng (Phân trang)
      tags:
        - Leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [public, private]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Bảng xếp hạng.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeaderboardEntry'
        '403':
          description: Private Leaderboard chưa được công bố.

  /challenges/{id}/contest-leaderboard:
    get:
      summary: Lấy bảng xếp hạng tổng hợp của Contest
      tags:
        - Leaderboard
      description: Lấy bảng xếp hạng tổng (cộng dồn điểm của các Challenge con) dành riêng cho các Contest (Parent Challenge).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [public, private]
      responses:
        '200':
          description: Bảng xếp hạng Contest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestLeaderboardResponse'
        '403':
          description: Private Leaderboard chưa được công bố hoặc không phải là Contest.

  # ==========================================
  # ADMIN ENDPOINTS
  # ==========================================
  /admin/users:
    get:
      summary: Danh sách Sinh viên (Admin)
      tags:
        - Admin
      parameters:
        - name: q
          in: query
          description: Tìm kiếm theo email hoặc họ tên
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách user (phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserResponse'
        '403':
          description: Không có quyền Admin.

  /admin/users/{id}:
    patch:
      summary: Khóa / Mở khóa tài khoản Sinh viên (Admin)
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: true = mở khóa, false = khóa tài khoản
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công.
        '403':
          description: Không có quyền Admin.
        '404':
          description: Không tìm thấy user.

  /admin/users/{id}/role:

  /admin/challenges/test-metric:
    post:
      summary: Chạy thử Metric (Admin)
      tags:
        - Admin
      description: Chạy thử file Ground Truth, Submission và Metric Script trong Sandbox để kiểm tra.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - ground_truth
                - submission
                - metric_name
              properties:
                ground_truth:
                  type: string
                  format: binary
                  description: File đáp án mẫu (CSV)
                submission:
                  type: string
                  format: binary
                  description: File bài nộp mẫu (CSV)
                metric_script:
                  type: string
                  format: binary
                  description: (Tùy chọn) Script python chấm điểm thủ công
                metric_name:
                  type: string
                  description: Tên metric (ví dụ ACCURACY, F1_SCORE, R2_SCORE, CUSTOM)
      responses:
        '200':
          description: Chạy Sandbox thành công, trả về điểm.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
        '400':
          description: Lỗi Sandbox hoặc lỗi file, trả về chi tiết.
        '403':
          description: Không có quyền Admin.

  /admin/challenges/{challenge_id}/submissions:
    get:
      summary: Lấy danh sách tất cả bài nộp của cuộc thi (Admin)
      tags:
        - Admin
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách bài nộp thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionList'
        '403':
          description: Không có quyền Admin.

  /admin/challenges/{challenge_id}/export-leaderboard:
    get:
      summary: Xuất Bảng xếp hạng ra file CSV (Admin)
      tags:
        - Admin
        - Leaderboard
      description: |
        Xuất toàn bộ BXH (cả public lẫn private) kèm thông tin Team, MSSV, Họ tên thành viên.
        File CSV encoding utf-8-sig (có BOM) để hiển thị đúng tiếng Việt trong Excel.
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
