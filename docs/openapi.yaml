openapi: 3.0.3
info:
  title: ICTU AI Judge API
  description: RESTful API spec for ICTU AI Judge Platform (FastAPI Backend)
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server

# Bảo mật: Yêu cầu JWT Token truyền ngầm qua HttpOnly Cookie thay vì Header Bearer.
security:
  - cookieAuth: []

paths:
  # ==========================================
  # AUTH & USER ENDPOINTS
  # ==========================================
  /auth/google-login:
    post:
      summary: Đăng nhập bằng Google OAuth
      tags:
        - Auth
      description: Gửi Google Access Token để đổi lấy JWT HttpOnly Cookie. Trả về thông tin User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                google_token:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công (Cookie được set ngầm).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token không hợp lệ hoặc email không thuộc @ictu.edu.vn

  /auth/logout:
    post:
      summary: Đăng xuất
      tags:
        - Auth
      description: Xóa JWT HttpOnly Cookie.
      responses:
        '200':
          description: Đăng xuất thành công.

  /users/me:
    get:
      summary: Lấy thông tin cá nhân
      tags:
        - Users
      responses:
        '200':
          description: Thông tin user hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Chưa đăng nhập.

  /users/me/teams:
    get:
      summary: Lấy danh sách Đội thi (và Bài thi) mà tôi đang tham gia
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Phân trang danh sách Teams.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Team'

  # ==========================================
  # CHALLENGE ENDPOINTS
  # ==========================================
  /challenges:
    get:
      summary: Lấy danh sách Bài thi
      tags:
        - Challenges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách bài thi (Phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Challenge'
                  
    post:
      summary: Tạo Bài thi mới (Admin)
      tags:
        - Challenges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreate'
      responses:
        '201':
          description: Tạo cấu trúc thông tin JSON thành công.

  /challenges/{id}/upload-secrets:
    post:
      summary: Upload File Đáp án và Script chấm điểm (Dành cho Admin)
      tags:
        - Challenges
      description: Upload File Ground Truth và Custom Metric để lưu an toàn trên Storage ngầm, thí sinh không thể truy cập.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ground_truth_csv:
                  type: string
                  format: binary
                  description: File đáp án bắt buộc chứa cột 'Usage'
                metric_script_py:
                  type: string
                  format: binary
                  description: (Tùy chọn) Script python chấm điểm thủ công
      responses:
        '200':
          description: Upload thành công.

  /challenges/{id}:
    get:
      summary: Chi tiết Bài thi
      tags:
        - Challenges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin chi tiết.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
    patch:
      summary: Cập nhật Bài thi (Admin)
      tags:
        - Challenges
      description: Cập nhật thông tin bài thi (mô tả, thời gian, luật thi). Bị khóa nếu bài đã có Submission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeUpdate'
      responses:
        '200':
          description: Cập nhật thành công.
        '403':
          description: Không có quyền (không phải Admin hoặc bài thi đã lock).
    delete:
      summary: Xóa mềm Bài thi (Admin - Soft Delete)
      tags:
        - Challenges
      description: Đặt `deleted_at` = now(), không xóa cứng khỏi Database.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Xóa mềm thành công.
        '403':
          description: Không có quyền hoặc bài thi đang diễn ra.

  /challenges/{id}/enroll:
    post:
      summary: Ghi danh (Tự động tạo Team of 1)
      tags:
        - Challenges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Ghi danh thành công, trả về Team ID.

  /challenges/{id}/participants:
    get:
      summary: Xem danh sách Whitelist (Admin)
      tags:
        - Challenges
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách sinh viên được cấp quyền tham gia Competition.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Participant'
    post:
      summary: Thêm Whitelist Participant (Admin)
      tags:
        - Challenges
        - Admin
      description: Thêm một hoặc nhiều user vào danh sách được phép tham gia Competition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách User ID cần thêm vào whitelist
      responses:
        '201':
          description: Thêm whitelist thành công.
        '403':
          description: Không có quyền Admin.

  # ==========================================
  # TEAM ENDPOINTS
  # ==========================================
  /teams/{id}/invites:
    post:
      summary: Trưởng nhóm tạo mã mời
      tags:
        - Teams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitee_email:
                  type: string
      responses:
        '201':
          description: Trả về Invite Token link.
        '403':
          description: Đội đã full hoặc bạn không phải trưởng nhóm.

  /teams/join:
    post:
      summary: Tham gia Đội qua mã mời
      tags:
        - Teams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Gia nhập thành công.
        '400':
          description: Bạn đã thuộc đội khác hoặc mã hết hạn.

  # ==========================================
  # SUBMISSION ENDPOINTS
  # ==========================================
  /challenges/{id}/submissions:
    get:
      summary: Lịch sử nộp bài của Đội
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách lượt nộp (Phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'

    post:
      summary: Upload file Nộp bài
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File CSV dự đoán
      responses:
        '201':
          description: File hợp lệ, bắt đầu chấm điểm ngầm (Trạng thái PENDING).
        '429':
          description: Vi phạm Rate Limit (Xin chờ X phút).
        '409':
          description: Trùng Hash MD5 (Spam, file này vừa nộp rồi).

  /submissions/{id}:
    patch:
      summary: Tích chọn bài tính điểm chung cuộc (Partial Update)
      tags:
        - Submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_selected_for_private:
                  type: boolean
      responses:
        '200':
          description: Cập nhật cờ chọn bài thành công.

  /submissions/{id}/source-code:
    post:
      summary: Upload Source Code cuối kỳ (Top N Teams)
      tags:
        - Submissions
      description: Dành cho Top N đội. Bắt buộc nộp File Zip hoặc Ipynb kèm requirements.txt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Nộp Source code thành công.
        '403':
          description: Cuộc thi chưa kết thúc hoặc đội không lọt Top N.

  # ==========================================
  # LEADERBOARD ENDPOINTS
  # ==========================================
  /challenges/{id}/leaderboard:
    get:
      summary: Lấy bảng xếp hạng (Phân trang)
      tags:
        - Leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [public, private]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Bảng xếp hạng.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeaderboardEntry'
        '403':
          description: Private Leaderboard chưa được công bố.

  # ==========================================
  # ADMIN ENDPOINTS
  # ==========================================
  /admin/users:
    get:
      summary: Danh sách Sinh viên (Admin)
      tags:
        - Admin
      parameters:
        - name: q
          in: query
          description: Tìm kiếm theo email hoặc họ tên
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách user (phân trang).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserResponse'
        '403':
          description: Không có quyền Admin.

  /admin/users/{id}:
    patch:
      summary: Khóa / Mở khóa tài khoản Sinh viên (Admin)
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: true = mở khóa, false = khóa tài khoản
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công.
        '403':
          description: Không có quyền Admin.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT Token được lưu an toàn trong HttpOnly Cookie.

  parameters:
    PageParam:
      name: page
      in: query
      description: Vị trí trang hiện tại
      schema:
        type: integer
        default: 1
    SizeParam:
      name: size
      in: query
      description: Số lượng item trên một trang
      schema:
        type: integer
        default: 20

  schemas:
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 1500
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 75

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [STUDENT, ADMIN]

    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        challenge_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid

    Challenge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        metric_direction:
          type: string
        dataset_url:
          type: string
          format: uri

    ChallengeCreate:
      type: object
      required:
        - title
        - type
        - start_time
        - end_time
        - metric_name
        - metric_direction
      properties:
        title:
          type: string
          example: "Phân loại ảnh CIFAR-10"
        description:
          type: string
          description: Mô tả bài toán (hỗ trợ Markdown)
        type:
          type: string
          enum: [PUBLIC, COMPETITION]
          description: Loại bài thi
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
          default: DRAFT
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        team_lock_deadline:
          type: string
          format: date-time
          description: Hạn chật khóa đội (trước end_time)
        rate_limit_minutes:
          type: integer
          default: 10
          description: Khoảng cách tối thiểu giữa 2 lần nộp (phút)
        max_file_size_mb:
          type: integer
          default: 50
          description: Giới hạn dung lượng file upload (MB)
        metric_name:
          type: string
          example: "Accuracy"
        metric_direction:
          type: string
          enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER]
        dataset_url:
          type: string
          format: uri
          description: Link Google Drive chứa dataset cho sinh viên tải về

    ChallengeUpdate:
      type: object
      description: Tất cả trường đều là tùy chọn (Partial Update). Bị khóa nếu có Submission.
      properties:
        title:
          type: string
        description:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        team_lock_deadline:
          type: string
          format: date-time
        rate_limit_minutes:
          type: integer
        max_file_size_mb:
          type: integer
        dataset_url:
          type: string
          format: uri
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]

    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        public_score:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCESS, FAILED]
        is_selected_for_private:
          type: boolean
        file_size_bytes:
          type: integer
          description: Kích thước file thực tế
        execution_time_ms:
          type: integer
          description: Thời gian Worker chấm bài (ms)
        error_message:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          example: 1
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
          example: "Team Alpha"
        best_public_score:
          type: number
          format: double
        best_private_score:
          type: number
          format: double
          nullable: true
          description: Chỉ có sau khi cuộc thi kết thúc
        last_submission_time:
          type: string
          format: date-time
          description: Mốc thời gian dùng để Tie-break khi cùng điểm
        is_selected_for_private:
          type: boolean
          description: Sinh viên đã chọn bài cho Private chưa

    Participant:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        is_approved:
          type: boolean
        joined_at:
          type: string
          format: date-time
